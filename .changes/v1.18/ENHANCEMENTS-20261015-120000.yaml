kind: ENHANCEMENTS
body: 'cli: Module package downloads over HTTP/HTTPS now reuse Terraform''s pooled HTTP client, so they send the Terraform user-agent and reuse connections while continuing to honor proxy configuration from the HTTP_PROXY, HTTPS_PROXY and NO_PROXY environment variables. The module package fetcher is also now safe to use when downloading multiple packages concurrently.'
